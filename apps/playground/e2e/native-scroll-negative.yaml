appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
    file: open-playground-android.yaml
    env:
      PLAYGROUND_URL: ${PLAYGROUND_URL}
- runFlow:
    when:
      platform: iOS
    file: open-playground.yaml
    env:
      PLAYGROUND_URL: ${PLAYGROUND_URL}
# Deliberately omit the gesture. This flow must fail; it qualifies the acceptance assertion.
- assertTrue: ${output.probe.y > 0 && output.probe.first > 1 && output.probe.drags > 0}
