appId: ${APP_ID}
---
- stopApp
- launchApp
- openLink: ${APP_URL}
- tapOn:
    text: "^Open$"
    optional: true
- tapOn:
    text: Continue
    optional: true
- extendedWaitUntil:
    visible: Open Crumbs inspector
    timeout: 120000
- tapOn: Open story list
# The story list occupies the lower half; a screen-centre scroll hits its search bar.
- repeat:
    times: 3
    commands:
      - swipe:
          start: 50%, 85%
          end: 50%, 60%
          duration: 500
- assertVisible: Diagnosis
- runFlow:
    when:
      notVisible: "(?-i)^Light$"
    commands:
      - tapOn: Diagnosis
- tapOn: "(?-i)^Light$"
- tapOn: Close story list
- tapOn: Open stories
- assertVisible: "Action count: 1"
- tapOn: Toggle inspected variant
- tapOn: Open stories
- assertVisible: "Action count: 1"
- tapOn: Open Crumbs inspector
# Android can discard the first tap immediately after Storybook updates its preview.
# Retry only while the panel is still closed, then require its visible heading/action.
- runFlow:
    when:
      notVisible: Close inspector
    commands:
      - tapOn: Open Crumbs inspector
- assertVisible: Close inspector
- tapOn: Inspect Showcase card
- scrollUntilVisible:
    element: '(?s).*resolvedValue.*#fbf6ed.*'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element: Inspect Showcase action
    direction: UP
    timeout: 20000
- tapOn: Inspect Showcase action
- scrollUntilVisible:
    element: '(?s).*"opacity":\s*0\.55.*'
    direction: DOWN
    timeout: 20000
- takeScreenshot: devtools-diagnosis-causes
- scrollUntilVisible:
    element: Inspect Override opacity
    direction: UP
    timeout: 20000
- tapOn: Inspect Override opacity
# Deliberately leave the capture open for the controlled Fast Refresh edit/restore.
