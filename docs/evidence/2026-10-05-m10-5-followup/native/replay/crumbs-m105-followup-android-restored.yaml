    direction: DOWN
    timeout: 15000
- tapOn: Run motion preview
- takeScreenshot: android-motion-full-restored
- scrollUntilVisible:
    element: "Native condition: normal"
    direction: DOWN
    timeout: 15000
- assertVisible: "Native condition: normal"
- takeScreenshot: android-context-restored
