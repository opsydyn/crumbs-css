name: publish-v1-approved-exception

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  V1_TOOLING_SHA256: 6b8aa4346aed420146dba06bf025d0cac102b8669afccd7edacab3f1f06cbd78

concurrency:
  group: crumbs-css-npm-publish-v1.0.0
  cancel-in-progress: false

jobs:
  qualify:
    permissions:
      contents: read
      actions: read
    runs-on: [self-hosted, macOS, ARM64, crumbs-m4-pro, crumbs-v1-1.0.0]
    timeout-minutes: 40
    steps:
      - name: Initialise isolated paths after runner assignment
        run: |
          V1_ROOT="$RUNNER_TEMP/crumbs-v1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$V1_ROOT"
          echo "V1_ROOT=$V1_ROOT" >> "$GITHUB_ENV"
          echo "BUN_INSTALL_CACHE_DIR=$V1_ROOT/bun-cache" >> "$GITHUB_ENV"
          echo "npm_config_cache=$V1_ROOT/npm-cache" >> "$GITHUB_ENV"

      - name: Require manual dispatch from main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: exit 1

      - name: Check out immutable v1 source and all qualification baselines
        uses: actions/checkout@v4
        with:
          ref: v1.0.0
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            /docs/

      - name: Use the isolated pinned Bun executable
        run: |
          test -n "$CRUMBS_V1_BUN_BINARY"
          test "$("$CRUMBS_V1_BUN_BINARY" --version)" = "1.4.2"
          test "$(shasum -a 256 "$CRUMBS_V1_BUN_BINARY" | cut -d ' ' -f 1)" = "35d20dd0263e5c950194434b925454fdfa9ba6e4467da960410fa05b08a7a5b5"
          dirname "$CRUMBS_V1_BUN_BINARY" >> "$GITHUB_PATH"

      - name: Set up exact Node floor
        uses: actions/setup-node@v4
        with:
          node-version: 22.0.0

      - name: Record floor executable
        id: floor
        run: echo "binary=$(command -v node)" >> "$GITHUB_OUTPUT"

      - name: Set up exact current Node and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Install isolated exact npm
        run: |
          npm install --ignore-scripts --prefix "$V1_ROOT/npm-tool" npm@11.12.1
          export PATH="$V1_ROOT/npm-tool/node_modules/.bin:$PATH"
          echo "$V1_ROOT/npm-tool/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Load exception tooling from the dispatched main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$V1_ROOT"
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/v1-publication.ts?ref=$GITHUB_SHA" --jq .content \
            | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > "$V1_ROOT/v1-publication.ts"
          test -s "$V1_ROOT/v1-publication.ts"
          test "$(shasum -a 256 "$V1_ROOT/v1-publication.ts" | cut -d ' ' -f 1)" = "$V1_TOOLING_SHA256"

      - name: Validate release and frozen dependencies
        env:
          CRUMBS_AUDIT_NODE_FLOOR: ${{ steps.floor.outputs.binary }}
        run: |
          bun run release:preflight --tag v1.0.0
          bun install --frozen-lockfile
          bun scripts/release-host-environment.ts

      - name: Require package and consumer functional qualification
        run: |
          bun run --filter @opsydyn/crumbs-css build
          bun run --filter @opsydyn/crumbs-css typecheck
          bun run test
          bun run app:typecheck
          bun run playground:distribution --check
          bun run --filter @opsydyn/crumbs-css bench:native-styles
          cd packages/css
          bun pm pack --dry-run

      - name: Verify retained qualification provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38059803838" > "$V1_ROOT/retained-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38059803838/attempts/1/jobs" > "$V1_ROOT/retained-jobs.json"
          node - "$V1_ROOT/retained-run.json" "$V1_ROOT/retained-jobs.json" <<'NODE'
          const assert = require("node:assert/strict")
          const fs = require("node:fs")
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))
          const jobs = JSON.parse(fs.readFileSync(process.argv[3], "utf8")).jobs
          assert.equal(run.id, 38059803838)
          assert.equal(run.head_sha, "f995e5595af55f23af8ae428dc0de8423e85464e")
          assert.equal(run.path, ".github/workflows/publish-v1.yml")
          assert.equal(run.event, "workflow_dispatch")
          assert.equal(run.head_branch, "main")
          assert.equal(run.run_attempt, 1)
          assert.equal(run.status, "completed")
          assert.equal(run.conclusion, "failure")
          const qualifiers = jobs.filter(job => job.name === "qualify")
          assert.equal(qualifiers.length, 1)
          const steps = qualifiers[0].steps
          for (const name of [
            "Check out immutable v1 source and all qualification baselines",
            "Use the isolated pinned Bun executable",
            "Validate release and frozen dependencies",
            "Require package and consumer functional qualification",
            "Prepare matched Expo and Metro scaffold",
            "Measure all unchanged host budgets",
            "Upload complete qualification evidence",
          ]) {
            const matches = steps.filter(step => step.name === name)
            assert.equal(matches.length, 1)
            assert.equal(matches[0].conclusion, "success", name)
          }
          assert.deepEqual(steps.filter(step => step.conclusion === "failure").map(step => step.name), ["Pack qualified bytes and seal the v1-only exception"])
          console.log("Verified successful functional qualification and all 21 measurements from the fixed retained run")
          NODE

      - name: Download the exact approved report and source-built tarball
        uses: actions/download-artifact@v4
        with:
          name: crumbs-v1-exception-qualification
          run-id: 38059803838
          github-token: ${{ github.token }}
          path: ${{ env.V1_ROOT }}/retained

      - name: Retain the exact approved report
        if: always()
        run: |
          if [ -d "$V1_ROOT/retained/host-report" ]; then
            mkdir -p "$V1_ROOT/bundle/host-report"
            cp -R "$V1_ROOT/retained/host-report/." "$V1_ROOT/bundle/host-report/"
          fi

      - name: Pack qualified bytes and seal the v1-only exception
        env:
          CRUMBS_AUDIT_NODE_FLOOR: ${{ steps.floor.outputs.binary }}
        run: |
          mkdir -p "$V1_ROOT/bundle"
          npm pack ./packages/css --ignore-scripts --json --pack-destination "$V1_ROOT/bundle" > "$V1_ROOT/npm-pack.json"
          cmp "$V1_ROOT/retained/opsydyn-crumbs-css-1.0.0.tgz" "$V1_ROOT/bundle/opsydyn-crumbs-css-1.0.0.tgz"
          bun "$V1_ROOT/v1-publication.ts" create --repo "$GITHUB_WORKSPACE" --report "$V1_ROOT/retained/host-report" --bundle "$V1_ROOT/bundle"

      - name: Upload complete qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crumbs-v1-exception-qualification
          path: ${{ env.V1_ROOT }}/bundle
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Initialise isolated publication paths
        run: |
          V1_ROOT="$RUNNER_TEMP/crumbs-v1-publication"
          mkdir -p "$V1_ROOT"
          echo "V1_ROOT=$V1_ROOT" >> "$GITHUB_ENV"

      - name: Check out the immutable published release
        uses: actions/checkout@v4
        with:
          ref: v1.0.0
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up exact current Node and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Load identical tooling from the dispatched commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$V1_ROOT"
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/v1-publication.ts?ref=$GITHUB_SHA" --jq .content \
            | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > "$V1_ROOT/v1-publication.ts"
          test -s "$V1_ROOT/v1-publication.ts"
          test "$(shasum -a 256 "$V1_ROOT/v1-publication.ts" | cut -d ' ' -f 1)" = "$V1_TOOLING_SHA256"

      - name: Download the sealed report and tarball
        uses: actions/download-artifact@v4
        with:
          name: crumbs-v1-exception-qualification
          path: ${{ env.V1_ROOT }}/bundle

      - name: Require published release and exact qualified source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run release:preflight --tag v1.0.0
          gh release view v1.0.0 --json isDraft,publishedAt | jq -e '.isDraft == false and .publishedAt != null' >/dev/null

      - name: Install verifier dependencies
        run: bun install --filter @opsydyn/crumbs-css --frozen-lockfile

      - name: Independently verify all evidence and the scoped exception
        run: bun "$V1_ROOT/v1-publication.ts" verify --repo "$GITHUB_WORKSPACE" --bundle "$V1_ROOT/bundle"

      - name: Publish only the verified v1 tarball
        working-directory: packages/css
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$V1_ROOT/bundle/opsydyn-crumbs-css-1.0.0.tgz" --access public --provenance --tag latest
