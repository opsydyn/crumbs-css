name: ci

on:
  pull_request:
    paths-ignore:
      - "apps/**"
      - "docs/**"
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-css-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-css-

      - name: Scope workspaces to packages only
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.workspaces = pkg.workspaces.filter(w => w.startsWith('packages'));
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Install packages/css dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
