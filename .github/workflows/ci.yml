name: ci

on:
  pull_request:
    paths-ignore:
      - "docs/**"
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-css-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-css-

      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test package, Storybook, and Expo/RN compatibility contracts
        run: bun run test

      - name: Typecheck Storybook consumer
        run: bun run app:typecheck

      - name: Qualify packed Expo consumer on iOS and web
        run: bun run playground:distribution --check
