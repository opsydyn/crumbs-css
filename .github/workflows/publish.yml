name: publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published GitHub release tag, for example v0.1.1-alpha.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: crumbs-css-npm-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Require workflow dispatch from main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Start the publish workflow from the main branch."
          exit 1

      - name: Require npm publishing token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "::error::NPM_TOKEN is required for the manual npm publish gate."
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Require a published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,publishedAt \
            | jq -e '.isDraft == false and .publishedAt != null' >/dev/null

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Validate release tag and dist-tag
        id: target
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bun run release:preflight --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build and validate release
        run: bun run release:check

      - name: Publish to npm
        working-directory: packages/css
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.target.outputs.npm_tag }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
