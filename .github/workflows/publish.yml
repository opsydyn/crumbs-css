name: publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published GitHub release tag, for example v0.1.1-alpha.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crumbs-css-npm-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [self-hosted, macOS, ARM64, crumbs-m4-pro]
    permissions:
      contents: read

    steps:
      - name: Require workflow dispatch from main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Start the publish workflow from the main branch."
          exit 1

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js 22.0.0 floor
        uses: actions/setup-node@v4
        with:
          node-version: 22.0.0

      - name: Record Node.js floor executable
        id: node-floor
        run: echo "binary=$(command -v node)" >> "$GITHUB_OUTPUT"

      - name: Set up current Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Validate release tag and dist-tag
        id: target
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bun run release:preflight --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check out approved Expo and Metro baseline
        uses: actions/checkout@v4
        with:
          ref: 43c5ece39360cf321fdb074d82cee41d5daaba23
          path: .m10-5-metro-baseline
          fetch-depth: 1

      - name: Install locked baseline dependencies
        working-directory: .m10-5-metro-baseline
        run: bun install --frozen-lockfile

      - name: Build package for host measurement
        run: bun run --filter @opsydyn/crumbs-css build

      - name: Prepare matched Expo and Metro scaffold
        env:
          BASELINE_ROOT: ${{ github.workspace }}/.m10-5-metro-baseline
          SCAFFOLD_ROOT: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/metro-scaffold
        run: bun scripts/prepare-matched-metro-scaffold.ts "$BASELINE_ROOT" "$SCAFFOLD_ROOT"

      - name: Measure approved host budgets
        env:
          CRUMBS_AUDIT_NODE_FLOOR: ${{ steps.node-floor.outputs.binary }}
          CRUMBS_HOST_BUDGET_REPORT: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/host-report
          CRUMBS_INCREMENTAL_REPO_ROOT: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/metro-scaffold
          CRUMBS_INCREMENTAL_APP_ROOT: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/metro-scaffold/apps/playground
          CRUMBS_RELEASE_SOURCE_REVISION: ${{ steps.target.outputs.release_commit }}
        run: |
          mkdir -p "$CRUMBS_HOST_BUDGET_REPORT"
          bun run measure:host-budgets "$CRUMBS_HOST_BUDGET_REPORT"

      - name: Stage host report for failure diagnostics
        if: always()
        env:
          CRUMBS_HOST_BUDGET_REPORT: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/host-report
          CRUMBS_QUALIFICATION_BUNDLE: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/qualification-bundle
        run: |
          if [ -d "$CRUMBS_HOST_BUDGET_REPORT" ]; then
            mkdir -p "$CRUMBS_QUALIFICATION_BUNDLE/host-report"
            cp -R "$CRUMBS_HOST_BUDGET_REPORT/." "$CRUMBS_QUALIFICATION_BUNDLE/host-report/"
          fi

      - name: Require the current report to satisfy consumer release policy
        env:
          CRUMBS_HOST_BUDGET_REPORT: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/host-report
          CRUMBS_RELEASE_SOURCE_REVISION: ${{ steps.target.outputs.release_commit }}
        run: bun run release:check

      - name: Pack the already-qualified package
        id: package-tarball
        working-directory: packages/css
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/qualification-bundle
          PACK_RESULT: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/npm-pack.json
        run: |
          mkdir -p "$BUNDLE_DIRECTORY"
          npm pack --ignore-scripts --json --pack-destination "$BUNDLE_DIRECTORY" > "$PACK_RESULT"
          TARBALL_NAME="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))[0].filename)' "$PACK_RESULT")"
          echo "path=$BUNDLE_DIRECTORY/$TARBALL_NAME" >> "$GITHUB_OUTPUT"

      - name: Qualify the exact release tarball on SDK 57
        env:
          PACKAGE_TARBALL: ${{ steps.package-tarball.outputs.path }}
          BUNDLE_DIRECTORY: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/qualification-bundle
        run: bun run playground:sdk-candidate --pinned --tarball "$PACKAGE_TARBALL" "$BUNDLE_DIRECTORY/sdk-57-qualification.json"

      - name: Seal report and exact tarball
        env:
          CRUMBS_AUDIT_NODE_FLOOR: ${{ steps.node-floor.outputs.binary }}
          CRUMBS_HOST_BUDGET_REPORT: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/host-report
          CRUMBS_QUALIFICATION_BUNDLE: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/qualification-bundle
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REVISION: ${{ steps.target.outputs.release_commit }}
          PACKAGE_TARBALL: ${{ steps.package-tarball.outputs.path }}
        run: bun scripts/release-qualification-artifact.ts create --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --report "$CRUMBS_HOST_BUDGET_REPORT" --tarball "$PACKAGE_TARBALL" --bundle "$CRUMBS_QUALIFICATION_BUNDLE"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crumbs-release-qualification-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/crumbs-m10-5-${{ github.run_id }}-${{ github.run_attempt }}/qualification-bundle
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the current release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org

      - name: Download qualified report and package tarball
        uses: actions/download-artifact@v4
        with:
          name: crumbs-release-qualification-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/crumbs-release-qualification

      - name: Recheck tag SHA and published release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          QUALIFICATION_BUNDLE: ${{ runner.temp }}/crumbs-release-qualification
        run: |
          CURRENT_TAG_SHA="$(git rev-parse HEAD)"
          QUALIFIED_SHA="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).sourceRevision)' "$QUALIFICATION_BUNDLE/manifest.json")"
          if [ "$CURRENT_TAG_SHA" != "$QUALIFIED_SHA" ]; then
            echo "::error::Release tag now points to $CURRENT_TAG_SHA, but qualification covered $QUALIFIED_SHA."
            exit 1
          fi
          bun run release:preflight --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          gh release view "$RELEASE_TAG" --json isDraft,publishedAt \
            | jq -e '.isDraft == false and .publishedAt != null' >/dev/null

      - name: Install only verifier dependencies
        run: bun install --filter @opsydyn/crumbs-css --frozen-lockfile

      - name: Verify the qualified bundle
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REVISION: ${{ steps.target.outputs.release_commit }}
          QUALIFICATION_BUNDLE: ${{ runner.temp }}/crumbs-release-qualification
        run: bun scripts/release-qualification-artifact.ts verify --bundle "$QUALIFICATION_BUNDLE" --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION"

      - name: Select verified tarball
        id: tarball
        env:
          QUALIFICATION_BUNDLE: ${{ runner.temp }}/crumbs-release-qualification
        run: |
          TARBALL_NAME="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).tarballName)' "$QUALIFICATION_BUNDLE/manifest.json")"
          echo "path=$QUALIFICATION_BUNDLE/$TARBALL_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        working-directory: packages/css
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.target.outputs.npm_tag }}
          PACKAGE_TARBALL: ${{ steps.tarball.outputs.path }}
        run: npm publish "$PACKAGE_TARBALL" --access public --provenance --tag "$NPM_DIST_TAG"
